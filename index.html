<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TTC3018 Studio v3</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
  body{background:#14171c;color:#e6edf3;display:flex;flex-direction:column;height:100vh;overflow:hidden}
  header{background:#1f242d;padding:12px 20px;border-bottom:1px solid #30363d;display:flex;justify-content:space-between;align-items:center}
  header h1{font-size:18px;color:#58a6ff}
  .status-bar{display:flex;align-items:center;gap:12px}
  .badge{padding:4px 10px;border-radius:12px;font-size:12px;font-weight:bold;background:#da3633;color:#fff}
  .badge.connected{background:#238636}
  button{background:#21262d;color:#c9d1d9;border:1px solid #30363d;padding:8px 14px;border-radius:6px;cursor:pointer;font-weight:600;font-size:13px}
  button:hover{background:#30363d}
  button:disabled{opacity:.4;cursor:not-allowed}
  button.primary{background:#238636;border-color:#2ea043;color:#fff}
  button.danger{background:#da3633;border-color:#f85149;color:#fff}
  button.accent{background:#1f6feb;border-color:#388bfd;color:#fff}
  .workspace{display:grid;grid-template-columns:340px 1fr 360px;flex:1;overflow:hidden}
  .panel{border-right:1px solid #30363d;padding:14px;display:flex;flex-direction:column;gap:10px;overflow-y:auto}
  .panel:last-child{border-right:none}
  .panel h2{font-size:13px;text-transform:uppercase;color:#8b949e;border-bottom:1px solid #30363d;padding-bottom:5px}
  .control-group{display:flex;flex-direction:column;gap:3px}
  .row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
  label{font-size:12px;color:#8b949e}
  input[type="number"],select,input[type="text"]{background:#0d1117;border:1px solid #30363d;color:#e6edf3;padding:6px 8px;border-radius:4px;font-size:13px;width:100%}
  .preview-area{background:#0d1117;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px}
  canvas{background:#fff;border:2px solid #30363d;max-width:100%;max-height:70vh}
  .dro{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:#0d1117;padding:10px;border-radius:6px;border:1px solid #30363d;text-align:center}
  .dro-axis{font-size:11px;color:#8b949e}.dro-val{font-size:18px;font-weight:bold;font-family:monospace;color:#58a6ff;margin:2px 0}
  .jog-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.jog-btn{padding:12px 6px;font-size:13px;font-weight:bold}
  .console{background:#0d1117;border:1px solid #30363d;border-radius:6px;padding:8px;font-family:monospace;font-size:11px;height:130px;overflow-y:auto;color:#7ee787;white-space:pre-wrap}
  .progress-bar{width:100%;height:10px;background:#0d1117;border-radius:5px;overflow:hidden;border:1px solid #30363d}
  .progress-fill{height:100%;width:0%;background:#238636}
</style>
</head>
<body>
<header>
  <h1>TTC3018 Studio v3</h1>
  <div class="status-bar">
    <select id="baudRate" style="width:110px"><option value="115200" selected>115200 baud</option><option value="9600">9600 baud</option></select>
    <span id="connStatus" class="badge">DISCONNECTED</span>
    <button id="btnConnect" class="accent">Connect USB</button>
    <button id="btnEStop" class="danger">STOP / RESET</button>
  </div>
</header>
<div class="workspace">
  <div class="panel">
    <h2>1. Load Image or G-Code</h2>
    <div class="control-group"><label>Select PNG/JPG Image OR .nc/.gcode File:</label><input type="file" id="fileInput" accept=".png,.jpg,.jpeg,.bmp,.webp,.nc,.gcode,.gc,.txt"></div>
    <div class="row"><div class="control-group"><label>Width (mm)</label><input type="number" id="carveWidth" value="100"></div><div class="control-group"><label>Height (mm)</label><input type="number" id="carveHeight" value="100"></div></div>
    <div class="row"><div class="control-group"><label>Cut Depth (mm)</label><input type="number" id="cutDepth" value="0.6" step="0.1"></div><div class="control-group"><label>Safe Z (mm)</label><input type="number" id="safeZ" value="3.0" step="0.5"></div></div>
    <div class="row"><div class="control-group"><label>Feed (mm/min)</label><input type="number" id="feedRate" value="400" step="50"></div><div class="control-group"><label>Stepover (mm)</label><input type="number" id="stepOver" value="0.25" step="0.05"></div></div>
    <div class="row"><div class="control-group"><label>Threshold (0-255)</label><input type="number" id="threshold" value="140"></div><div class="control-group"><label>Spindle RPM</label><input type="number" id="spindleSpeed" value="10000" step="500"></div></div>
    <button id="btnGen" class="primary">Generate Toolpath &amp; G-Code</button>
    <button id="btnDownloadGcode" disabled>Download .nc File</button>
  </div>
  <div class="preview-area">
    <div style="margin-bottom:10px"><span id="jobStats" style="font-size:13px;color:#8b949e">Select an image on the left to begin.</span></div>
    <canvas id="previewCanvas" width="500" height="500"></canvas>
  </div>
  <div class="panel">
    <h2>2. Jog &amp; Zero Machine</h2>
    <div class="dro">
      <div><div class="dro-axis">X AXIS</div><div class="dro-val" id="posX">0.00</div><button data-cmd="G92 X0" style="padding:4px 8px;font-size:11px">Zero X</button></div>
      <div><div class="dro-axis">Y AXIS</div><div class="dro-val" id="posY">0.00</div><button data-cmd="G92 Y0" style="padding:4px 8px;font-size:11px">Zero Y</button></div>
      <div><div class="dro-axis">Z AXIS</div><div class="dro-val" id="posZ">0.00</div><button data-cmd="G92 Z0" style="padding:4px 8px;font-size:11px">Zero Z</button></div>
    </div>
    <div class="row"><button data-cmd="G92 X0 Y0 Z0" class="accent">Zero ALL (XYZ)</button><button data-cmd="G90 G0 X0 Y0">Go to XY Zero</button></div>
    <div class="row"><label style="flex:0 0 65px">Step:</label><select id="jogStep"><option value="0.1">0.1 mm</option><option value="1" selected>1 mm</option><option value="5">5 mm</option><option value="10">10 mm</option><option value="25">25 mm</option></select><button data-cmd="$X">Unlock ($X)</button></div>
    <div class="jog-grid">
      <div></div><button class="jog-btn" data-jog="Y,1">Y+</button><div></div><button class="jog-btn" data-jog="Z,1">Z+</button>
      <button class="jog-btn" data-jog="X,-1">X-</button><button class="jog-btn" data-cmd="G90 G0 Z3">Safe Z</button><button class="jog-btn" data-jog="X,1">X+</button><button class="jog-btn" data-jog="Z,-1">Z-</button>
      <div></div><button class="jog-btn" data-jog="Y,-1">Y-</button><div></div><div></div>
    </div>
    <div class="row"><button data-cmd="M3 S10000">Spindle ON</button><button data-cmd="M5">Spindle OFF</button></div>
    <h2>3. Run Carve</h2>
    <div class="row"><button id="btnRunJob" class="primary" disabled>START CARVE</button><button id="btnPauseJob" disabled>Pause</button></div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div id="progressText" style="font-size:12px;color:#8b949e;text-align:center">Idle — 0%</div>
    <div class="row"><input type="text" id="manualCmd" placeholder="Manual G-code (e.g. G0 X10)"><button id="btnSendManual" style="flex:0 0 60px">Send</button></div>
    <div class="console" id="consoleLog">Ready v3. Click Connect USB at the top right.</div>
  </div>
</div>
<script>
let port, writer, reader, isConnected = false, loadedImage = null, gcodeLines = [], isRunning = false, isPaused = false, idx = 0, waitOk = false, timer;

function log(m) {
  const c = document.getElementById('consoleLog');
  c.textContent += '\n' + m;
  c.scrollTop = c.scrollHeight;
}

async function connectUSB() {
  if (isConnected) {
    isRunning = false;
    clearInterval(timer);
    try { await reader.cancel(); await writer.close(); await port.close(); } catch (e) {}
    isConnected = false;
    document.getElementById('connStatus').textContent = 'DISCONNECTED';
    document.getElementById('connStatus').classList.remove('connected');
    document.getElementById('btnConnect').textContent = 'Connect USB';
    log('Disconnected.');
    return;
  }
  log('Opening USB port selector...');
  try {
    port = await navigator.serial.requestPort();
    const baud = parseInt(document.getElementById('baudRate').value, 10);
    await port.open({ baudRate: baud });
    isConnected = true;
    document.getElementById('connStatus').textContent = 'CONNECTED';
    document.getElementById('connStatus').classList.add('connected');
    document.getElementById('btnConnect').textContent = 'Disconnect';
    log('CONNECTED at ' + baud + ' baud!');
    const enc = new TextEncoderStream();
    enc.readable.pipeTo(port.writable);
    writer = enc.writable.getWriter();
    readLoop();
    setTimeout(function() { sendCmd('\r\n'); }, 400);
    timer = setInterval(function() { if (isConnected && writer) writer.write('?').catch(function() {}); }, 400);
  } catch (e) {
    log('Connect failed: ' + e.message);
  }
}

async function readLoop() {
  const dec = new TextDecoderStream();
  port.readable.pipeTo(dec.writable);
  reader = dec.writable.getReader();
  let buf = '';
  try {
    while (true) {
      const res = await reader.read();
      if (res.done) break;
      buf += res.value;
      let lines = buf.split('\n');
      buf = lines.pop();
      for (let i = 0; i < lines.length; i++) {
        let l = lines.item ? lines.item(i) : lines.at(i);
        l = l.trim();
        if (!l) continue;
        if (l.charCodeAt(0) === 60) {
          let part = l.split('WPos:').at(1) || l.split('MPos:').at(1);
          if (part) {
            let coords = part.split('|').at(0).split(',');
            if (coords.length >= 3) {
              document.getElementById('posX').textContent = parseFloat(coords.at(0)).toFixed(2);
              document.getElementById('posY').textContent = parseFloat(coords.at(1)).toFixed(2);
              document.getElementById('posZ').textContent = parseFloat(coords.at(2)).toFixed(2);
            }
          }
        } else {
          if (l !== 'ok') log('RX: ' + l);
          if (l.startsWith('ok') || l.startsWith('error')) {
            waitOk = false;
            if (isRunning && !isPaused) nextLine();
          }
        }
      }
    }
  } catch (e) {
    if (isConnected) log('Serial stopped: ' + e.message);
  }
}

async function sendCmd(c) {
  if (!isConnected || !writer) return log('Click Connect USB first!');
  log('TX: ' + c);
  await writer.write(c + '\n');
}

function handleFile(e) {
  const f = e.target.files.item(0);
  if (!f) return;
  const n = f.name.toLowerCase();
  const cv = document.getElementById('previewCanvas');
  const ctx = cv.getContext('2d');
  if (n.endsWith('.nc') || n.endsWith('.gcode') || n.endsWith('.gc') || n.endsWith('.txt')) {
    const r = new FileReader();
    r.onload = function(ev) {
      gcodeLines = ev.target.result.split('\n').map(function(l) { return l.trim(); }).filter(function(l) { return l && !l.startsWith(';') && !l.startsWith('('); });
      loadedImage = null;
      ctx.fillStyle = '#0d1117';
      ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.fillStyle = '#58a6ff';
      ctx.font = '18px sans-serif';
      ctx.fillText('Loaded: ' + f.name + ' (' + gcodeLines.length + ' lines)', 25, 60);
      document.getElementById('jobStats').textContent = 'G-Code ready: ' + gcodeLines.length + ' lines';
      document.getElementById('btnRunJob').disabled = false;
      document.getElementById('btnDownloadGcode').disabled = false;
      log('Loaded ' + f.name + ' (' + gcodeLines.length + ' lines).');
    };
    r.readAsText(f);
  } else {
    const img = new Image();
    img.onload = function() {
      loadedImage = img;
      const w = parseFloat(document.getElementById('carveWidth').value) || 100;
      document.getElementById('carveHeight').value = Math.round(w * (img.height / img.width));
      generateGcodeFromImage();
    };
    img.src = URL.createObjectURL(f);
  }
}

function generateGcodeFromImage() {
  if (!loadedImage) return log('Select an image file first.');
  const W = parseFloat(document.getElementById('carveWidth').value);
  const H = parseFloat(document.getElementById('carveHeight').value);
  const Z = -Math.abs(parseFloat(document.getElementById('cutDepth').value));
  const SZ = Math.abs(parseFloat(document.getElementById('safeZ').value));
  const F = parseInt(document.getElementById('feedRate').value, 10);
  const S = parseFloat(document.getElementById('stepOver').value);
  const T = parseInt(document.getElementById('threshold').value, 10);
  const RPM = parseInt(document.getElementById('spindleSpeed').value, 10);
  const cols = Math.max(10, Math.floor(W / S));
  const rows = Math.max(10, Math.floor(H / S));
  const off = document.createElement('canvas');
  off.width = cols; off.height = rows;
  const octx = off.getContext('2d');
  octx.fillStyle = '#fff'; octx.fillRect(0, 0, cols, rows);
  octx.drawImage(loadedImage, 0, 0, cols, rows);
  const d = octx.getImageData(0, 0, cols, rows).data;
  const cv = document.getElementById('previewCanvas');
  const ctx = cv.getContext('2d');
  cv.width = 500; cv.height = Math.round(500 * (H / W));
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.fillStyle = '#111';
  const lines = ['G21', 'G90', 'G0 Z' + SZ.toFixed(2), 'M3 S' + RPM, 'G4 P2'];
  const pxW = cv.width / cols, pxH = cv.height / rows;
  for (let r = 0; r < rows; r++) {
    const iR = rows - 1 - r, yMm = (r * S).toFixed(3), ltr = r % 2 === 0;
    let cut = false;
    for (let i = 0; i <= cols; i++) {
      const c = ltr ? i : cols - 1 - i;
      let blk = false;
      if (i < cols) {
        const k = (iR * cols + c) * 4;
        blk = (0.299 * d.at(k) + 0.587 * d.at(k + 1) + 0.114 * d.at(k + 2)) < T;
        if (blk) ctx.fillRect(c * pxW, iR * pxH, Math.ceil(pxW), Math.ceil(pxH));
      }
      if (blk && !cut) {
        cut = true;
        lines.push('G0 X' + ((ltr ? c : c + 1) * S).toFixed(3) + ' Y' + yMm, 'G1 Z' + Z.toFixed(3) + ' F' + Math.max(100, Math.round(F * 0.5)));
      } else if (!blk && cut) {
        cut = false;
        lines.push('G1 X' + ((ltr ? c : c + 1) * S).toFixed(3) + ' Y' + yMm + ' F' + F, 'G0 Z' + SZ.toFixed(2));
      }
    }
  }
  lines.push('G0 Z' + SZ.toFixed(2), 'M5', 'G0 X0 Y0');
  gcodeLines = lines;
  document.getElementById('jobStats').textContent = 'Ready: ' + W + 'x' + H + 'mm | ' + gcodeLines.length + ' lines';
  document.getElementById('btnRunJob').disabled = false;
  document.getElementById('btnDownloadGcode').disabled = false;
  log('Generated ' + gcodeLines.length + ' lines.');
}

async function nextLine() {
  if (!isRunning || isPaused || waitOk) return;
  if (idx >= gcodeLines.length) {
    isRunning = false;
    document.getElementById('btnPauseJob').disabled = true;
    document.getElementById('progressFill').style.width = '100%';
    document.getElementById('progressText').textContent = 'DONE — 100%';
    return log('--- CARVE COMPLETE ---');
  }
  const l = gcodeLines.at(idx++);
  waitOk = true;
  const p = Math.round((idx / gcodeLines.length) * 100);
  document.getElementById('progressFill').style.width = p + '%';
  document.getElementById('progressText').textContent = 'Carving: ' + p + '% (' + idx + '/' + gcodeLines.length + ')';
  await writer.write(l + '\n');
}

document.getElementById('btnConnect').addEventListener('click', connectUSB);
document.getElementById('btnEStop').addEventListener('click', async function() { isRunning = false; isPaused = false; waitOk = false; if (isConnected && writer) { await writer.write('\x18'); log('!!! STOP SENT !!!'); } });
document.getElementById('fileInput').addEventListener('change', handleFile);
document.getElementById('btnGen').addEventListener('click', generateGcodeFromImage);
document.getElementById('btnDownloadGcode').addEventListener('click', function() { if (!gcodeLines.length) return; const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([gcodeLines.join('\n')], { type: 'text/plain' })); a.download = 'ttc3018_carve.nc'; a.click(); });
document.getElementById('btnRunJob').addEventListener('click', function() { if (!isConnected) return log('Click Connect USB first!'); if (!gcodeLines.length) return log('Load an image first!'); if (isRunning) return; isRunning = true; isPaused = false; idx = 0; waitOk = false; document.getElementById('btnPauseJob').disabled = false; document.getElementById('btnPauseJob').textContent = 'Pause'; log('--- STARTING CARVE ---'); nextLine(); });
document.getElementById('btnPauseJob').addEventListener('click', async function() { if (!isRunning) return; isPaused = !isPaused; await writer.write(isPaused ? '!' : '~'); document.getElementById('btnPauseJob').textContent = isPaused ? 'Resume' : 'Pause'; log(isPaused ? '--- PAUSED ---' : '--- RESUMED ---'); if (!isPaused && !waitOk) nextLine(); });
document.getElementById('btnSendManual').addEventListener('click', function() { const el = document.getElementById('manualCmd'); if (el.value.trim()) { sendCmd(el.value.trim()); el.value = ''; } });
document.querySelectorAll('[data-cmd]').forEach(function(b) { b.addEventListener('click', function() { sendCmd(b.dataset.cmd); }); });
document.querySelectorAll('[data-jog]').forEach(function(b) { b.addEventListener('click', function() { const parts = b.dataset.jog.split(','); sendCmd('$J=G91 G21 ' + parts.at(0) + (parseFloat(document.getElementById('jogStep').value) * parseFloat(parts.at(1))) + ' F1000'); }); });
</script>
</body>
</html>
